<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto&display=swap");

        *{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;

        }

        body{
            min-height: 100vh;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-auto-rows: 50px auto 50px;
            grid-template-areas:
            
            "hd hd hd hd hd hd hd hd hd"
            "mn mn mn mn mn mn mn sb sb"
            "ft ft ft ft ft ft ft ft ft";
            gap: 0.5rem;
        }
        .el
        {
            background-color: plum;
            color: white;
            display: grid;
            place-content: center;
        }
        .header{
            grid-area: hd;
        }
        .sidebar{
            grid-area: sb;
            background-color: plum;
        }
        .footer{
            grid-area: ft;
        }
        .container{
            grid-area: mn;
            
            display: grid;
            border: 1px solid tomato;
            /* ⁡⁢⁣⁢grid-auto-flow: column;⁡ */
            /* we will have 6 columns easily  */
            /* ⁡⁢⁣⁢grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;⁡ */
            /* this will help us define each column's width rather than doing it auto, here fr =fraction specifically used for grid  */
            /* ⁡⁢⁣⁢grid-template-columns: repeat(6, 1fr);⁡ */
            /* this will say 6 cols each of 1 fraction  */
            grid-template-columns: repeat(2, 1fr 2fr);
            /* this says 4 column 1st will have 1fr next 2 and this repeats for second part  */
            /* ⁡⁢⁣⁢grid-auto-rows: 100px;⁡ */
            /* each row becomes 100px */
            grid-auto-rows: minmax(150px, auto);
            /* both rows 150px tall and we have auto for max i.e we container were taller it would let it grow  */
            min-height: 400px;
            /* these will make the boxes inside grow too but they cant be less than 150 x as said above  */
            row-gap: 1rem;
            column-gap: 1em;
            


        }
        .box {
            background-color: black;
            color: white;
            font-size: 2rem;
            padding: 0.5rem;
        }
        .box:first-child{
            background-color: rgb(110, 139, 227);
            grid-column-start: 1;
            /* grid starts at first column line ie browser starting  */
            grid-column-end: 4;
            /* grid ends at 4th line  */
            grid-row-start: 1;
            grid-row-end: 3;
            /* starts at row 1 and ends at 3rd line  */
            display: grid;
            align-items: end;
            justify-content: center;
            
        }
        .box:nth-child(2)
        {
            background-color: rgb(235, 195, 235);
            grid-column-start: 1;
            grid-column-end: 5;
            grid-row-start: 3;
            grid-row-end: 4;
        }
    </style>
</head>
<body>
    <header class="header el"><h1>Header</h1></header>
    <main class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </main>
    <aside class="sidebar el"><h2>Sidebar</h2></aside>
    <footer class="footer el"><h2>Footer</h2></footer>
</body>
</html>
