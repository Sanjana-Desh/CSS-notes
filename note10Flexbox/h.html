<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    *{
        font-family: "Roboto";
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        min-height: 100vh;
        padding: 20px;
    }
    .container{
        max-width: 800px;
        min-height: 400px;
        border: 1px solid rgb(0, 0, 0);
        margin: auto;
        display: flex;
        /* They become horizontal, and start from left */
        /* justify-content: flex-end; */
        /* they all move to right now  */
        justify-content: center;
        /* other values are space around, or spaced evenly  */
        gap: 1rem;
        /* between each flex item theres gap  */
        align-items: center;
        flex-direction: row-reverse;
        /* by deafault it is horizontal, row reverse also there */
        flex-wrap: wrap;
        /* to avoid overflow  */
        flex-flow: row nowrap;
        /* instead of flex direction and wrap we can use below flex flow  */
        align-content: space-evenly ;
        /* like justify content it centers when the responsive is diffrent  */
        
       
    }

    .box
    {
        /* min-width: 100px; */
        height: 100px;
        background-color: black;
        color: white;
        font-size: 2rem;
        padding: 0.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        align-content: center;
        flex-basis: 250px;
        /* flex-basis in CSS defines the initial size of a flex item before any extra space is distributed 
        or the item grows/shrinks based on the flex-grow or flex-shrink properties. It determines the base size of the item along the main axis of the flex container.  */
        flex-grow: 1;
        
        /* here 1 says both the box should grow together  */
        /* he flex-grow property in CSS is used to control how much a flex item expands relative to the other items inside a flex container. It defines how much space a flex item should take up when there is extra space available in the container.  */
        /* by default, flex items only grow horizontally when you use flex-grow, because the default flex direction in Flexbox is row  */

        
    }

  

    .box:nth-child(2){
        /* flex-shrink: 2; */
        flex: 2 2 250px;
        /* at rate 2 its growing and shrinking  */
        /* see read me  */
    }
    </style>
</style>
</head>
<body>
    <main class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <!-- <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div> -->
    </main>
</body>
</html>
